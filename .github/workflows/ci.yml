name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  repository-health:
    name: Repository health check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required docs
        run: |
          test -f README.md
          test -f .github/pull_request_template.md
